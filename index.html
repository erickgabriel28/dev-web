        <h1>Cadastro de alunos</h1>
        <h2>Alunos cadastrados</h2>
        <table border="1" cellpadding="10" cellspacting="0">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Curso</th>
                    <th>Idade</th>
                    <th>Cidade</th>
                </tr>
            </thead>
            <tbody>

                <tr>

            </tbody>
        </table>

        <h2>Novo Cadastro</h2>
        <form action="#" method="post">
            
            <label for="nome">Nome completo:</label>
            <br><br>
            <input type="text" id="mome" placeholder="Digite seu nome">
            <br><br>

            <label for="email">Email</label>
            <br><br>
            <input type="text" id="email" placeholder="Digite seu email">
            <br><br>

            <label for="idade">Idade</label>
            <br><br>
            <input type="number" id="idade" placeholder="Digite sua idade">
            <br><br>

            <label for="curso">Escolha seu curso:</label>
            <select name="curso" id="curso">
                <option value="">selecione um curso</option>
                <option value="informatica">Informatica</option>
                <option value="excel">Excel</option>
                <option value="desenvolvimento">Desenvolvimento de sitema</option>
            </select>
            <br><br>
            <label for="mensagem">Observação:</label>
            <textarea id="mensagem" rows="4" placeholder="Digite alguma observação"></textarea>
            <br><br>
            <button type="submit">Cadastrar</button>


        </form>

</body>
