<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 3</title>
    

</head>
<body>
    
    <form action="#" method="post">

        <label for="nome">Nome:</label>
        <input type="text" td="nome" placeholder="Seu nome..." required>
        <br><br>
        <label for="email">Email:</label>
        <input type="text" id="email" placeholder="seuemail@gnail.com">
        <br><br>
        <label for="senha">Senha</label>
        <input type="password" id="senha" required>
        <br><br>
        <label for="mensagem">mensagem</label>
        <textarea name="mensagem" id="mensagem" cols="67" rows="10" placeholder="Escreve aqui..."></textarea>
        <br><br>
        <label for="cidade">Cidade:</label>
        <select name="cidade" id="cidade">
            <option value="">Selecione...</option>
            <option value="nh">Novo Hamburgo</option>
            <option value="sl">São leopoldo</option>
            <option value="cb">Campo Bom</option>
            <option value="mgo">Monte Negro</option>
        </select>
    </form>
    <br><br>
    <fieldset>
        <legend>Gênero:</legend>
        <input type="radio" id="masc" name="genero" value="M">
        <label for="masc">Masculino</label>
        <input type="radio" id="fem" nome="genero" value="F">
        <label for="fem">Feminino</label>
    </fieldset>

</body>
</html>
