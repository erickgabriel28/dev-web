        <table border="3" cellspacing="3" cellpading="4">
            <tr>
                <td colspan="4">
                    <h1>Formulariozex</h3>
                </td>
            </tr>
        </table>
        <br>

        <form action="#" method="post"></form>
        
        <label for="nome">Nome:</label>
        <input type="text" td="nome" placeholder="Seu nome completo..." required>
        <br><br>
        <label for="email">Email:</label>
        <input type="text" id="email" placeholder="seuemail@gnail.com">
        <br><br>
        <label for="cpf">CPF:</label>
        <input type="text" td="cpf" placeholder="Seu CPF..." required>
        <br><br>
        
        <fieldset>
            <legend>Gênero:</legend>
            <input type="radio" id="masc" name="genero" value="M">
            <label for="masc">Masculino</label>
            <input type="radio" id="fem" nome="genero" value="F">
            <label for="fem">Feminino</label>
        </fieldset>
        <br><br>
        <label for="cidade">Cidade:</label>
        <select name="cidade" id="cidade">
            <option value="">Selecione...</option>
            <option value="nh">Novo Hamburgo</option>
            <option value="sl">Salvador do Sul</option>
            <option value="cb">Campo Bom</option>
            <option value="mgo">Porto Alegre</option>
        </select>
        <br><br>
        <label for="tel">Telefone:</label>
        <input type="tel" id="telefone" pattern="/([0-9]{2}\) [0-9]{5}-[0-9]{3}" placeholder="(51) 99999 9999">
        <br><br>
        <button type="submit">Enviar</button>

    </div>
