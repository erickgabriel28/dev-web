<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 4</title>
    

</head>
<body>
    
        <h1>Faça seu cadastro</h1>

    <form action="#" method="post">

        <label for="nome">Nome:</label>
        <br><br>
        <input type="text" td="nome" placeholder="Seu nome completo...">
        <br><br>
        <label for="email">E-mail:</label>
        <br><br>
        <input type="email" id="email" placeholder="seuemail@gnail.com">
        <br><br>
        <label for="senha">Senha (min 6, so letras e numeros):</label>
        <br><br>
        <input type="password" id="senha" pattern="[a-ZA-Z0-9]{6,}" placeholder="Minimo 6 caracteres..." required>
        <br><br>
        <label for="Idade">Idade (13 a 99):</label>
        <br><br>
        <input type="number" id="idade" min="13" max="99" required>
        <br><br>
        <label for="data">Data (so em 2026):</label>
        <br><br>
        <input type="date" id="data" min="2026-01-01" max="2026-12-31">
        <br><br>
        <input type="tel" id="telefone" pattern="/([0-9]{2}\) [0-9]{5}-[0-9]{3}" placeholder="(51) 99999 9999">
        <br><br>
        <label for="nota">Nota (0 a 10):</label>
        <br><br>
        <input type="range" id="nota" min="10" max="10" value="7">
        <br><br>
        <label for="cor">Cor favorita</label>
        <br><br>
        <input type="color" id="cor" value="#3498db">
        <br><br>
        <label for="codigo">Codigo (gerado automaticamente)</label>
        <br><br>
        <input type="text" id="codigo" value="ALU-2026-001" disabled>
        <br><br>
        <button type="submit">Enviar</button>

    </form>

</body>
</html>
